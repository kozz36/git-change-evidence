schema: spec-driven

context: |
  Product: git-change-evidence.
  Status: Inventory V1 is merged; this repository contains its implementation, tests, and closure evidence.
  Architecture: Functional Core / Imperative Shell with Hexagonal profile adapters.
  Runtime baseline: Go 1.25.10. The public neutral API is at the module root,
  the CLI is at cmd/git-change-evidence/, and non-public shell/adapters are under internal/.
  Go source, co-located Go tests, and the go.mod module identity now exist.
  Evidence-only boundary: never approve, reject, gate, block, merge, deploy, release,
  or assign delivery authority.
  Module identity: github.com/kozz36/git-change-evidence (owner-approved). Current repository facts:
  implementation, co-located tests, and CI exist; Apache-2.0 and the planned source/dev preview
  identity v0.1.0-preview.1 are selected. Deferred: broad distribution, packaging,
  signing/provenance, release automation, and concrete configuration-file syntax.

strict_tdd: true
testing:
  policy: rubric
  commands:
    primary: go test ./...
    concurrency: go test -race ./...
    format_check: test -z "$(find . -path './.git' -prune -o -path './.codegraph' -prune -o -type f -name '*.go' -print0 | xargs -0 -r gofmt -l)"
  rubric:
    active: true
    authoritative: true
    mode_order: [skip, standard, strict-tdd]
    resolution:
      matching: all-rows
      mode: strictest-wins
      evidence: union
    rows:
      - signature: go-source-or-test
        paths: ['**/*.go']
        mode: strict-tdd
        disciplines:
          - red-green-triangulate-refactor
          - focused-test-before-production-change
          - rerun-focused-tests-after-refactor
        evidence_methods:
          - focused-go-test
          - go-test-all
          - check-only-gofmt
        source: bootstrap-decision
      - signature: concurrency-bearing-go
        applies_when: The changed Go behavior creates, synchronizes, or otherwise depends on concurrent execution.
        mode: strict-tdd
        disciplines:
          - race-detection
        evidence_methods:
          - go-test-race-all
        source: bootstrap-decision
      - signature: default
        mode: skip
        disciplines: []
        evidence_methods: []
        source: bootstrap-decision

layout:
  scope: repository-development guidance only; never a generic-core policy or evidence threshold
  public_api: {directory: ., allowed: public neutral Go API files and their co-located tests, exception: narrowly approved public census subpackage only}
  cli: {directory: cmd/git-change-evidence, allowed: CLI adaptation only}
  non_public: {directory: internal, allowed: shell implementations and adapters only}
  tests: {placement: co-located *_test.go files}
  prohibited: [pkg, Python-style src plus tests split, package-level AGENTS.md files]
  thresholds: {public_root_go_files: 12, cli_go_files: 6, internal_leaf_package_go_files: 15, changed_lines_per_go_file: 160, changed_go_files_per_package: 8}
  crossing_policy: Record each first threshold crossing in apply-progress.md and require an explicit package-boundary review before adding files beyond that threshold.
  initial_file_crossing_baseline: {phase: PR 1 / Bootstrap Decision, public_root_go_files: 0, cli_go_files: 0, internal_leaf_package_go_files: 0, go_test_files: 0, changed_lines_per_go_file: 0, changed_go_files_per_package: 0}

rules:
  proposal:
    - Preserve the evidence-only charter boundary and record only owner-approved bootstrap decisions.
  specs:
    - Use Given/When/Then scenarios and RFC 2119 keywords.
    - Public APIs and documents are neutral, versioned Go package and canonical-document contracts.
  design:
    - Document architecture decisions with rationale and preserve deferred owner decisions.
  tasks:
    - Group tasks by phase and keep each task completable in one session.
    - Keep work within its declared chained-PR boundary.
  apply:
    tdd: true
    test_command: go test ./...
    race_test_command: go test -race ./...
    format_command: test -z "$(find . -path './.git' -prune -o -path './.codegraph' -prune -o -type f -name '*.go' -print0 | xargs -0 -r gofmt -l)"
  verify:
    test_command: go test ./...
    race_test_command: go test -race ./...
    format_command: test -z "$(find . -path './.git' -prune -o -path './.codegraph' -prune -o -type f -name '*.go' -print0 | xargs -0 -r gofmt -l)"
    build_command: go test ./...
    coverage_threshold: 0
    manual_evidence:
      go-ast-census:
        scenarios: [GAC-008-S01, GAC-009-S01, GAC-010-S01]
  archive:
    - Preserve the complete audit trail and warn before destructive deltas.
