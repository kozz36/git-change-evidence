name: Go PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: go-pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  go-checks:
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out pull request
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.10"
          cache: false
      - name: Check formatting
        run: test -z "$(find . -path './.git' -prune -o -path './.codegraph' -prune -o -type f -name '*.go' -print0 | xargs -0 -r gofmt -l)"
      - name: Run tests
        run: go test ./...
      - name: Run race tests
        run: go test -race ./...
